name: screenify

services:
  postgres:
    image: postgres:17-alpine
    container_name: screenify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: screenify
      POSTGRES_PASSWORD: screenify
      POSTGRES_DB: screenify
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenify -d screenify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: