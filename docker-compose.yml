name: screenify

services:
  postgres:
    image: postgres:17-alpine
    container_name: screenify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: screenify
      POSTGRES_PASSWORD: screenify
      POSTGRES_DB: screenify
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenify -d screenify"]
      interval: 5s
      timeout: 5s
      retries: 10

  # O backend empacotado como vai para produção. Só sobe com: docker compose --profile full up
  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: screenify-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      CLIENT_URL: http://localhost:5173
      # Dentro da rede do Compose, o banco é alcançado pelo nome do serviço
      DATABASE_URL: postgresql://screenify:screenify@postgres:5432/screenify?schema=public
      # Escuta em todas as interfaces do container e anuncia o endereço pelo qual o navegador chega
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: 127.0.0.1
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40000
      TRUST_PROXY: 0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:40000:40000/udp"
      - "127.0.0.1:40000:40000/tcp"

volumes:
  postgres_data: